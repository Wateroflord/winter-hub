name: Apps smoke test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Download APKs
        run: |
          mkdir -p apks out
          for a in winter-chess:Winter-Chess winter-mines:Winter-Mines winter-paint:Winter-Paint draw-school:Draw-School winter-music:Winter-Music forest-survival:Forest-Survival mog-battle:Mog-Battle winter-walks:Winter-Walks winter-hub:Winter-Hub; do
            repo=${a%%:*}; asset=${a##*:}
            gh release download -R Wateroflord/$repo -p "$asset.apk" -D apks || echo "no $asset" >> out/status.txt
          done
          ls -la apks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tools/apps_smoke.sh
      - name: Save
        if: always()
        run: |
          git config user.name "winter-hub-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan apps-smoke-out
          git rm -rf --cached . > /dev/null
          git add -f out
          git commit -m "smoke" > /dev/null
          git push -f origin apps-smoke-out
