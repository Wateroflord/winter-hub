name: Check (branches)

# Быстрая проверка кода на рабочих ветках: анализ и тесты, без сборки и релиза.
# Полная сборка без релиза: Actions → Build APK → Run workflow (ветка) → снять «publish».
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shared CI tools (winter-hub/ci)
        uses: actions/checkout@v4
        with:
          repository: Wateroflord/winter-hub
          path: .winter
          sparse-checkout: /ci/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Prepare
        run: |
          flutter create --project-name winter_sprites --org com.winterhub --platforms android .
          rm -f test/widget_test.dart
          flutter pub get
      - name: Analyze
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1 && ok=1 || ok=0
          cat analyze.txt
          python3 .winter/ci/annotate.py analyze.txt "analyze"
          [ "$ok" = 1 ]
      - name: Unit tests
        run: flutter test
