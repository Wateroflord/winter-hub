name: Windows smoke test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install every app with its own installer and start it
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          function Shot($name) { $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size); $bmp.Save("out\$name.png") }
          $apps = @(
            @("winter-hub","Winter-Hub","Winter Hub","winter_hub"),
            @("winter-chess","Winter-Chess","Winter Chess","winter_chess"),
            @("winter-mines","Winter-Mines","Winter Mines","winter_mines"),
            @("winter-paint","Winter-Paint","Winter Paint","winter_paint"),
            @("draw-school","Draw-School","Draw School","draw_school"),
            @("winter-music","Winter-Music","Winter Music","winter_music"),
            @("forest-survival","Forest-Survival","Forest Survival","forest_survival"),
            @("winter-walks","Winter-Walks","Winter Walks","winter_walks")
          )
          foreach ($a in $apps) {
            $repo=$a[0]; $asset=$a[1]; $dir=$a[2]; $exe=$a[3]
            gh release download -R "Wateroflord/$repo" -p "$asset-Setup.exe" --clobber
            if (-not (Test-Path "$asset-Setup.exe")) { "$asset no-setup" | Out-File -Append out\status.txt; continue }
            $p = Start-Process ".\$asset-Setup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -PassThru
            $p.WaitForExit(240000) | Out-Null
            Start-Sleep 20
            $running = [bool](Get-Process $exe -ErrorAction SilentlyContinue)
            "$asset installer=$($p.ExitCode) running=$running" | Out-File -Append out\status.txt
            Shot $asset
            Get-Process $exe -ErrorAction SilentlyContinue | Stop-Process -Force
          }
          Get-ChildItem "$env:LOCALAPPDATA\Programs\Winter Chess" -ErrorAction SilentlyContinue | Select-Object Name,Length | Out-File -Append out\status.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save
        if: always()
        shell: bash
        run: |
          git config user.name "winter-hub-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan winsmoke-out
          git rm -rf --cached . > /dev/null
          git add -f out
          git commit -m "smoke" > /dev/null
          git push -f origin winsmoke-out
