name: Sync signing secret

# Копирует секрет WINTER_SIGNING из winter-hub во все репозитории приложений Winter.
# Нужны два секрета только в winter-hub:
#   WINTER_SIGNING — ключ подписи (из файла WINTER_SIGNING.txt)
#   ADMIN_TOKEN    — токен GitHub с правом «Secrets: Read and write» на все репозитории
# Запускается раз в сутки (чтобы новые репозитории тоже получили ключ),
# вручную и пушем в ветку secrets-sync.
on:
  schedule:
    - cron: '17 2 * * *'
  push:
    branches: [secrets-sync]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Sync
        env:
          GH_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          WINTER_SIGNING: ${{ secrets.WINTER_SIGNING }}
        run: |
          set -e
          if [ -z "$GH_TOKEN" ] || [ -z "$WINTER_SIGNING" ]; then
            echo "::warning title=Секреты::В winter-hub ещё нет ADMIN_TOKEN или WINTER_SIGNING — раздавать нечего."
            exit 0
          fi
          python3 -c "import base64,json,os;d=json.loads(base64.b64decode(os.environ['WINTER_SIGNING'].strip()));assert d['keystore'] and d['password']" \
            || { echo "::error title=Секреты::WINTER_SIGNING вставлен не полностью — скопируй файл WINTER_SIGNING.txt целиком и вставь заново"; exit 1; }
          repos=$(python3 -c "import json;c=json.load(open('catalog.json'));print(' '.join(sorted({a['repo'] for a in c['apps']}|{'Wateroflord/winter-language'})))")
          ok=0; bad=0
          for r in $repos; do
            if printf '%s' "$WINTER_SIGNING" | gh secret set WINTER_SIGNING -R "$r" 2>/tmp/err.txt; then
              echo "OK   $r"; ok=$((ok+1))
            else
              echo "FAIL $r: $(head -1 /tmp/err.txt)"; bad=$((bad+1))
              echo "::warning title=Секреты::$r — не получилось. Проверь, что у токена доступ ко всем репозиториям и право Secrets: Read and write."
            fi
          done
          echo "### Ключ подписи: добавлен в $ok репозиториев, ошибок: $bad" >> "$GITHUB_STEP_SUMMARY"
          [ "$ok" -gt 0 ]
