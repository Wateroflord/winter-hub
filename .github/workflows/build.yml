name: Build Winter Hub

on:
  push:
    branches: [main]
    paths-ignore:
      - 'ci/**'
      - '.github/workflows/sign-test.yml'
      - '.github/workflows/secrets-sync.yml'
      - 'catalog.json'
      - 'versions.json'
      - '.github/workflows/versions.yml'
      - 'README.md'
      - '.github/workflows/winsmoke.yml'
      - '.github/workflows/apps-smoke.yml'
      - 'tools/apps_smoke.sh'
      - '.github/workflows/flutter-app.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Выпустить релиз (выключи, чтобы только проверить сборку)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  app:
    uses: ./.github/workflows/flutter-app.yml
    secrets: inherit
    with:
      project: winter_hub
      org: com.winterhub
      asset: Winter-Hub
      title: Winter Hub
      win_title: Winter Hub
      win_size: '900, 820'
      core_tests: true
      publish: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
